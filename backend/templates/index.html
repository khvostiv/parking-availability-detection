<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Lot Status</title>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Parking Lot Status</h1>
    <div class="video-container">
        <img src="{{ url_for('video_feed') }}" alt="Live feed of parking lot showing current availability of parking spaces">
    </div>

    <div class="legend">
        <div class="legend-item">
            <span class="legend-color green"></span> Free Spot
        </div>
        <div class="legend-item">
            <span class="legend-color red"></span> Occupied Spot
        </div>
    </div>

    <div class="button-container">
        <a href="http://localhost:3000/" class="button">Back to Map</a>
    </div>
</body>
</html>
